name: i18n deep audit (report)

# Non-blocking language report on every PR. Surfaces hardcoded UI strings,
# untranslated leftovers (values still identical to English), and wrong-script
# / mixed-language values. It NEVER fails the build — the blocking gate is the
# separate `npm run i18n:audit` (key/placeholder parity + must-translate
# namespaces). This job just posts a sticky comment so reviewers can see
# language drift at a glance. Run locally anytime: `npm run i18n:audit:deep`.

on:
  pull_request:
    paths:
      - "messages/**"
      - "app/**"
      - "components/**"
      - "scripts/language-audit.mjs"
      - ".github/workflows/i18n-deep-audit.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  deep-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The audit only uses Node built-ins, so no dependency install is needed.
      - name: Run deep language audit
        id: audit
        run: |
          node scripts/language-audit.mjs > audit-report.txt 2>&1 || true
          {
            echo 'report<<AUDIT_EOF'
            cat audit-report.txt
            echo 'AUDIT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upsert PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- i18n-deep-audit -->';
            const body = `${marker}\n## 🌐 i18n deep audit (non-blocking report)\n\nFull report from \`npm run i18n:audit:deep\`. Untranslated/wrong-script counts include intentional brand names, units, and loanwords kept identical on purpose.\n\n\`\`\`\n${process.env.REPORT}\n\`\`\`\n`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
        env:
          REPORT: ${{ steps.audit.outputs.report }}
