name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install -g npm@11.12.1
      - run: npm --version
      - run: npm run lockfile:check
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
