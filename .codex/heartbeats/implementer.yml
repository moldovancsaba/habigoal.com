name: implementer
managed_by: codex_automation
schedule:
  cadence: every_3_hours
  offset: 60m
agent: implementer
workspace:
  write: true
memory:
  - .codex/memory/project_state.json
  - .codex/memory/backlog.json
  - .codex/memory/architecture.md
tools:
  - github
  - filesystem
  - terminal
constraints:
  - never_force_push
  - never_merge_without_tests
  - never_push_directly_to_main
prompt: |
  Select the highest leverage safe task from the current focus.
  Then:
  - implement it on a branch
  - run lint
  - run tests
  - run build
  - commit the changes
  - push the branch
  - open or update a pull request
  - update issue and project status
  Never merge failing code.
